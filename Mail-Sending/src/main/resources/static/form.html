<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>

                <!-- Contact Form -->
                <div class="contact-form-wrapper">
                    <h3>Book Your Wedding</h3>
                    
                    <div id="form-status" class="form-status"></div>

                    <form id="booking-form" class="booking-form">
                        <div class="form-group">
                            <label for="name">Full Name <span class="required">*</span></label>
                            <input type="text" id="name" name="name" required>
                        </div>

                        <div class="form-group">
                            <label for="email">Email <span class="required">*</span></label>
                            <input type="email" id="email" name="email" required>
                        </div>

                        <div class="form-group">
                            <label for="weddingDate">Wedding Date <span class="required">*</span></label>
                            <input type="date" id="weddingDate" name="weddingDate" required>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="venue">Venue Type</label>
                                <input type="text" id="venue" name="venue" placeholder="Garden, Ballroom, etc.">
                            </div>

                            <div class="form-group">
                                <label for="style">Photography Style</label>
                                <input type="text" id="style" name="style" placeholder="Classic, Modern, etc.">
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="budget">Approximate Budget</label>
                            <input type="text" id="budget" name="budget" placeholder="$5,000 - $15,000">
                        </div>

                        <div class="form-group">
                            <label for="message">Additional Details</label>
                            <textarea id="message" name="message" rows="4" placeholder="Tell us about your vision, special requirements, timeline..."></textarea>
                        </div>

                        <button type="submit" class="btn btn-primary btn-full">Send Booking Inquiry</button>
                    </form>
                </div>
            </div>
        </div>
    </section> 
    
    <script>
document.getElementById("booking-form").addEventListener("submit", function (e) {
    e.preventDefault();

    const data = {
        name: document.getElementById("name").value,
        email: document.getElementById("email").value,
        weddingDate: document.getElementById("weddingDate").value,
        venue: document.getElementById("venue").value,
        style: document.getElementById("style").value,
        budget: document.getElementById("budget").value,
        message: document.getElementById("message").value
    };

    fetch("http://localhost:8080/api/booking", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(data)
    })
    .then(res => res.text())
    .then(response => {
        document.getElementById("form-status").innerHTML =
            "<p style='color:green;'>Booking inquiry sent successfully!</p>";
        document.getElementById("booking-form").reset();
    })
    .catch(err => {
        document.getElementById("form-status").innerHTML =
            "<p style='color:red;'>Something went wrong. Please try again.</p>";
    });
});
</script>
    
</body>
</html>
